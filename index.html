<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>リリアン家計簿</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#fff7fa;

  color:#555;

  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;

}

header{

  background:linear-gradient(135deg,#f5c5d6,#e9a9bd);

  padding:24px 18px 20px;

  text-align:center;

  color:white;

}

h1{margin:0;font-size:25px}

.subtitle{font-size:12px;margin-top:5px}

.tabs{

  display:flex;

  background:white;

  padding:8px;

  gap:5px;

  position:sticky;

  top:0;

  z-index:5;

  box-shadow:0 2px 8px #eddde2;

}

.tab{

  flex:1;

  border:0;

  background:#fff0f5;

  border-radius:13px;

  padding:10px 2px;

  color:#b87891;

  font-size:12px;

}

.tab.active{

  background:#e9a9bd;

  color:white;

  font-weight:bold;

}

main{

  padding:16px;

  max-width:600px;

  margin:auto;

}

.card{

  background:white;

  border-radius:20px;

  padding:18px;

  margin-bottom:14px;

  box-shadow:0 3px 12px #e9ccd5;

}

.card h3{

  margin-top:0;

  color:#b87891;

}

.balance{

  font-size:28px;

  font-weight:bold;

  color:#bd6f8b;

}

.month-total{

  font-size:25px;

  font-weight:bold;

  color:#bd6f8b;

}

.wallet{

  font-size:12px;

  color:#999;

  margin-top:3px;

}

.wallet-buttons{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.wallet-button{

  border:0;

  border-radius:16px;

  padding:16px 8px;

  background:#fff0f5;

  color:#b87891;

  line-height:1.7;

}

label{

  display:block;

  margin:12px 0 5px;

  font-size:13px;

}

input,select,button{

  font:inherit;

}

input,select{

  width:100%;

  padding:12px;

  border:1px solid #efd8df;

  border-radius:12px;

  background:#fff;

}

.add{

  width:100%;

  border:0;

  border-radius:15px;

  padding:14px;

  margin-top:15px;

  background:#d98ca8;

  color:white;

  font-weight:bold;

}

.category-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:11px 0;

  border-bottom:1px solid #f4e5e9;

}

.category-name{

  display:flex;

  align-items:center;

  gap:7px;

}

.category-amount{

  font-weight:bold;

  color:#b86684;

}

.item{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:13px 0;

  border-bottom:1px solid #f4e5e9;

}

.item-main{

  min-width:0;

}

.item-memo{

  word-break:break-all;

}

.amount{

  font-weight:bold;

  color:#b86684;

  white-space:nowrap;

}

.income{

  color:#6d9d7e;

}

.item-actions{

  text-align:right;

  min-width:90px;

}

.edit-button,

.delete-button{

  border:0;

  background:none;

  font-size:12px;

  margin-top:5px;

}

.edit-button{

  color:#b87891;

}

.delete-button{

  color:#c99;

}

.empty{

  text-align:center;

  color:#aaa;

  padding:20px 0;

  font-size:13px;

}

.setting-title{

  font-weight:bold;

  color:#b87891;

  margin-bottom:8px;

}

.category-setting{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:10px 0;

  border-bottom:1px solid #f4e5e9;

}

.category-setting button{

  border:0;

  background:none;

  color:#c99;

  font-size:12px;

}

.small-note{

  font-size:11px;

  color:#aaa;

  margin-top:6px;

}

/* 編集画面 */

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:rgba(70,40,50,.35);

  z-index:20;

  padding:20px;

  overflow:auto;

}

.modal-box{

  max-width:520px;

  margin:30px auto;

  background:white;

  border-radius:22px;

  padding:20px;

}

.modal-title{

  color:#b87891;

  font-weight:bold;

  font-size:18px;

  margin-bottom:10px;

}

.cancel{

  width:100%;

  border:1px solid #efd8df;

  background:white;

  color:#b87891;

  border-radius:14px;

  padding:12px;

  margin-top:8px;

}

</style>

</head>

<body>

<header>

  <h1>♡ リリアン家計簿 ♡</h1>

  <div class="subtitle">毎日の家計をかわいくシンプルに</div>

</header>

<div class="tabs">

  <button class="tab active" onclick="showTab('home',this)">ホーム</button>

  <button class="tab" onclick="showTab('add',this)">入力</button>

  <button class="tab" onclick="showTab('history',this)">履歴</button>

  <button class="tab" onclick="showTab('settings',this)">設定</button>

</div>

<main>

<section id="home">

  <div class="card">

    <div class="wallet">現在の合計残高</div>

    <div class="balance" id="totalBalance">¥0</div>

  </div>

  <div class="card">

    <h3>♡ お財布</h3>

    <div class="wallet-buttons">

      <button class="wallet-button" onclick="selectWallet('家計簿')">

        🏠<br>家計簿

      </button>

      <button class="wallet-button" onclick="selectWallet('リリアン個人')">

        🎀<br>リリアン個人

      </button>

      <button class="wallet-button" onclick="selectWallet('リリアン給与')">

        💰<br>リリアン給与

      </button>

      <button class="wallet-button" onclick="selectWallet('教育')">

        📚<br>教育

      </button>

    </div>

  </div>

  <div class="card">

    <h3>♡ 今月の支出</h3>

    <div class="wallet">今月の合計</div>

    <div class="month-total" id="monthTotal">¥0</div>

    <div id="categoryTotals"></div>

  </div>

  <div class="card">

    <h3>♡ 最近の記録</h3>

    <div id="recentList"></div>

  </div>

</section>

<section id="add" style="display:none">

  <div class="card">

    <h3>♡ お金を記録する</h3>

    <label>お財布</label>

    <select id="wallet" onchange="updateCategorySelect()">

      <option>家計簿</option>

      <option>リリアン個人</option>

      <option>リリアン給与</option>

      <option>教育</option>

    </select>

    <label>種類</label>

    <select id="type">

      <option value="expense">支出</option>

      <option value="income">収入</option>

    </select>

    <label>カテゴリ</label>

    <select id="category"></select>

    <label>金額</label>

    <input

      id="amount"

      type="number"

      inputmode="numeric"

      placeholder="例：1200"

    >

    <label>内容</label>

    <input

      id="memo"

      type="text"

      placeholder="例：スーパー"

    >

    <label>日付</label>

    <input id="date" type="date">

    <button class="add" onclick="addRecord()">

      ♡ 記録する

    </button>

  </div>

</section>

<section id="history" style="display:none">

  <div class="card">

    <h3>♡ 家計簿の履歴</h3>

    <div id="historyList"></div>

  </div>

</section>

<section id="settings" style="display:none">

  <div class="card">

    <h3>♡ カテゴリ設定</h3>

    <div class="small-note">

      財布ごとにカテゴリを管理できます。あとから追加もOK♡

    </div>

    <div id="categorySettings"></div>

  </div>

</section>

</main>

<!-- 編集用 -->

<div class="modal" id="editModal">

  <div class="modal-box">

    <div class="modal-title">♡ 記録を編集</div>

    <input type="hidden" id="editId">

    <label>お財布</label>

    <select id="editWallet" onchange="updateEditCategorySelect()">

      <option>家計簿</option>

      <option>リリアン個人</option>

      <option>リリアン給与</option>

      <option>教育</option>

    </select>

    <label>種類</label>

    <select id="editType">

      <option value="expense">支出</option>

      <option value="income">収入</option>

    </select>

    <label>カテゴリ</label>

    <select id="editCategory"></select>

    <label>金額</label>

    <input id="editAmount" type="number">

    <label>内容</label>

    <input id="editMemo" type="text">

    <label>日付</label>

    <input id="editDate" type="date">

    <button class="add" onclick="saveEdit()">

      ♡ 変更を保存

    </button>

    <button class="cancel" onclick="closeEdit()">

      キャンセル

    </button>

  </div>

</div>

<script>

const defaultCategories = {

  "家計簿":[

    "食費",

    "日用品",

    "住居",

    "交通",

    "外食",

    "その他"

  ],

  "リリアン個人":[

    "美容",

    "衣服",

    "趣味",

    "その他"

  ],

  "リリアン給与":[

    "給与",

    "その他"

  ],

  "教育":[

    "塾",

    "教材",

    "学校",

    "習い事",

    "その他"

  ]

};

let categories =

  JSON.parse(

    localStorage.getItem("ririanWalletCategories") || "null"

  ) || defaultCategories;

let records =

  JSON.parse(

    localStorage.getItem("ririanRecords") || "[]"

  );

/*

以前のバージョンで作った記録には

カテゴリがない場合があるので「その他」にする

*/

records = records.map(r => {

  if(!r.category){

    r.category = "その他";

  }

  return r;

});

function save(){

  localStorage.setItem(

    "ririanRecords",

    JSON.stringify(records)

  );

  localStorage.setItem(

    "ririanWalletCategories",

    JSON.stringify(categories)

  );

}

function yen(n){

  return "¥" + Number(n).toLocaleString("ja-JP");

}

function todayString(){

  return new Date().toISOString().slice(0,10);

}

document.getElementById("date").value =

  todayString();

function getCategories(wallet){

  return categories[wallet] || ["その他"];

}

function updateCategorySelect(){

  const wallet =

    document.getElementById("wallet").value;

  const select =

    document.getElementById("category");

  const list =

    getCategories(wallet);

  select.innerHTML =

    list.map(c =>

      `<option value="${escapeHtml(c)}">${categoryIcon(c)} ${escapeHtml(c)}</option>`

    ).join("");

}

function addRecord(){

  const wallet =

    document.getElementById("wallet").value;

  const type =

    document.getElementById("type").value;

  const category =

    document.getElementById("category").value;

  const amount =

    Number(document.getElementById("amount").value);

  const memo =

    document.getElementById("memo").value.trim();

  const date =

    document.getElementById("date").value;

  if(!amount){

    alert("金額を入力してね♡");

    return;

  }

  records.unshift({

    id:Date.now(),

    wallet:wallet,

    type:type,

    category:category,

    amount:amount,

    memo:memo || "記録",

    date:date

  });

  save();

  document.getElementById("amount").value="";

  document.getElementById("memo").value="";

  update();

  alert("記録したよ♡");

  showTab(

    "home",

    document.querySelector(".tab")

  );

}

function selectWallet(name){

  document.getElementById("wallet").value = name;

  updateCategorySelect();

  showTab(

    "add",

    document.querySelectorAll(".tab")[1]

  );

}

function showTab(name,button){

  ["home","add","history","settings"].forEach(id => {

    document.getElementById(id).style.display =

      id === name ? "block" : "none";

  });

  document.querySelectorAll(".tab").forEach(t => {

    t.classList.remove("active");

  });

  if(button){

    button.classList.add("active");

  }

  update();

}

function update(){

  let total = 0;

  records.forEach(r => {

    if(r.type === "income"){

      total += Number(r.amount);

    }else{

      total -= Number(r.amount);

    }

  });

  document.getElementById(

    "totalBalance"

  ).textContent = yen(total);

  const month =

    todayString().slice(0,7);

  const thisMonth =

    records.filter(r =>

      r.date &&

      r.date.slice(0,7) === month

    );

  let monthTotal = 0;

  thisMonth.forEach(r => {

    if(r.type === "expense"){

      monthTotal += Number(r.amount);

    }

  });

  document.getElementById(

    "monthTotal"

  ).textContent = yen(monthTotal);

  /*

  カテゴリ別小計

  */

  const totals = {};

  thisMonth.forEach(r => {

    if(r.type !== "expense") return;

    const key =

      r.wallet + "||" + (r.category || "その他");

    totals[key] =

      (totals[key] || 0) + Number(r.amount);

  });

  let categoryHtml = "";

  Object.keys(categories).forEach(wallet => {

    const walletCategories =

      categories[wallet];

    const walletRows =

      walletCategories

        .filter(c =>

          totals[wallet + "||" + c] > 0

        )

        .map(c => `

          <div class="category-row">

            <div class="category-name">

              ${walletIcon(wallet)}

              ${escapeHtml(wallet)}

              ／

              ${categoryIcon(c)}

              ${escapeHtml(c)}

            </div>

            <div class="category-amount">

              ${yen(totals[wallet + "||" + c])}

            </div>

          </div>

        `)

        .join("");

    if(walletRows){

      categoryHtml += walletRows;

    }

  });

  document.getElementById(

    "categoryTotals"

  ).innerHTML =

    categoryHtml ||

    '<div class="empty">今月の支出はまだないよ♡</div>';

  const recent =

    records.slice(0,5);

  document.getElementById(

    "recentList"

  ).innerHTML =

    recent.length

      ? recent.map(makeItem).join("")

      : '<div class="empty">まだ記録がないよ♡</div>';

  document.getElementById(

    "historyList"

  ).innerHTML =

    records.length

      ? records.map(makeItem).join("")

      : '<div class="empty">まだ記録がないよ♡</div>';

  updateCategorySettings();

}

function makeItem(r){

  const sign =

    r.type === "income" ? "+" : "-";

  const amountClass =

    r.type === "income"

      ? "amount income"

      : "amount";

  return `

    <div class="item">

      <div class="item-main">

        <div class="item-memo">

          ${categoryIcon(r.category)}

          ${escapeHtml(r.memo)}

        </div>

        <div class="wallet">

          ${walletIcon(r.wallet)}

          ${escapeHtml(r.wallet)}

          ・

          ${escapeHtml(r.category || "その他")}

          ・

          ${escapeHtml(r.date)}

        </div>

      </div>

      <div class="item-actions">

        <div class="${amountClass}">

          ${sign}${yen(r.amount)}

        </div>

        <button

          class="edit-button"

          onclick="openEdit(${r.id})"

        >

          編集

        </button>

        <button

          class="delete-button"

          onclick="deleteRecord(${r.id})"

        >

          削除

        </button>

      </div>

    </div>

  `;

}

function openEdit(id){

  const r =

    records.find(x => x.id === id);

  if(!r) return;

  document.getElementById("editId").value =

    r.id;

  document.getElementById("editWallet").value =

    r.wallet;

  document.getElementById("editType").value =

    r.type;

  document.getElementById("editAmount").value =

    r.amount;

  document.getElementById("editMemo").value =

    r.memo;

  document.getElementById("editDate").value =

    r.date;

  updateEditCategorySelect();

  const cat =

    getCategories(r.wallet);

  if(cat.includes(r.category)){

    document.getElementById("editCategory").value =

      r.category;

  }else{

    document.getElementById("editCategory").value =

      cat[cat.length-1];

  }

  document.getElementById("editModal").style.display =

    "block";

}

function updateEditCategorySelect(){

  const wallet =

    document.getElementById("editWallet").value;

  const select =

    document.getElementById("editCategory");

  const list =

    getCategories(wallet);

  select.innerHTML =

    list.map(c =>

      `<option value="${escapeHtml(c)}">${categoryIcon(c)} ${escapeHtml(c)}</option>`

    ).join("");

}

function saveEdit(){

  const id =

    Number(document.getElementById("editId").value);

  const r =

    records.find(x => x.id === id);

  if(!r) return;

  const amount =

    Number(document.getElementById("editAmount").value);

  if(!amount){

    alert("金額を入力してね♡");

    return;

  }

  r.wallet =

    document.getElementById("editWallet").value;

  r.type =

    document.getElementById("editType").value;

  r.category =

    document.getElementById("editCategory").value;

  r.amount =

    amount;

  r.memo =

    document.getElementById("editMemo").value.trim()

    || "記録";

  r.date =

    document.getElementById("editDate").value;

  save();

  closeEdit();

  update();

}

function closeEdit(){

  document.getElementById("editModal").style.display =

    "none";

}

function deleteRecord(id){

  if(!confirm("この記録を削除する？")) return;

  records =

    records.filter(r => r.id !== id);

  save();

  update();

}

function updateCategorySettings(){

  let html = "";

  Object.keys(categories).forEach(wallet => {

    html += `

      <div class="setting-title">

        ${walletIcon(wallet)} ${escapeHtml(wallet)}

      </div>

    `;

    categories[wallet].forEach(category => {

      const canDelete =

        category !== "その他";

      html += `

        <div class="category-setting">

          <span>

            ${categoryIcon(category)}

            ${escapeHtml(category)}

          </span>

          ${

            canDelete

            ?

            `<button onclick="deleteCategory('${escapeAttr(wallet)}','${escapeAttr(category)}')">

              削除

            </button>`

            :

            ""

          }

        </div>

      `;

    });

    html += `

      <button

        class="small-button"

        style="margin:10px 0 20px"

        onclick="addCategory('${escapeAttr(wallet)}')"

      >

        ＋ ${escapeHtml(wallet)}にカテゴリを追加

      </button>

    `;

  });

  document.getElementById(

    "categorySettings"

  ).innerHTML = html;

}

function addCategory(wallet){

  const name =

    prompt(

      "「" + wallet + "」に追加するカテゴリ名を入力してね♡"

    );

  if(!name) return;

  const trimmed =

    name.trim();

  if(!trimmed) return;

  if(categories[wallet].includes(trimmed)){

    alert("そのカテゴリはもうあるよ♡");

    return;

  }

  categories[wallet].push(trimmed);

  save();

  updateCategorySelect();

  update();

  alert(

    "「" + trimmed + "」を追加したよ♡"

  );

}

function deleteCategory(wallet,category){

  if(category === "その他"){

    alert("「その他」は残しておこう♡");

    return;

  }

  const used =

    records.some(r =>

      r.wallet === wallet &&

      r.category === category

    );

  if(used){

    alert(

      "このカテゴリを使った記録があるので、削除できないよ♡"

    );

    return;

  }

  if(

    !confirm(

      "「" + category + "」を削除する？"

    )

  ) return;

  categories[wallet] =

    categories[wallet].filter(

      c => c !== category

    );

  save();

  updateCategorySelect();

  update();

}

function categoryIcon(category){

  const icons = {

    "食費":"🍚",

    "日用品":"🧻",

    "住居":"🏠",

    "交通":"🚃",

    "外食":"🍴",

    "美容":"💄",

    "衣服":"👗",

    "趣味":"🎀",

    "給与":"💰",

    "塾":"✏️",

    "教材":"📖",

    "学校":"🏫",

    "習い事":"🎹",

    "その他":"♡"

  };

  return icons[category] || "♡";

}

function walletIcon(wallet){

  const icons = {

    "家計簿":"🏠",

    "リリアン個人":"🎀",

    "リリアン給与":"💰",

    "教育":"📚"

  };

  return icons[wallet] || "♡";

}

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function escapeAttr(text){

  return String(text)

    .replace(/\\/g,"\\\\")

    .replace(/'/g,"\\'");

}

updateCategorySelect();

save();

update();

</script>

</body>

</html>
