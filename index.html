<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>リリアン家計簿</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  background:#fff7fa;

  color:#555;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",

    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;

}

header{

  background:linear-gradient(135deg,#ffdce9,#f9dff2);

  padding:20px 16px 18px;

  text-align:center;

  color:#8b6375;

  box-shadow:0 2px 8px rgba(180,120,150,.12);

}

header h1{

  margin:0;

  font-size:24px;

  letter-spacing:1px;

}

header p{

  margin:5px 0 0;

  font-size:12px;

}

.container{

  max-width:700px;

  margin:auto;

  padding:14px;

}

.wallet-tabs{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:7px;

  margin-bottom:14px;

}

.wallet-tab{

  border:none;

  background:white;

  border-radius:14px;

  padding:10px 3px;

  color:#777;

  font-size:12px;

  box-shadow:0 2px 7px rgba(180,120,150,.1);

  cursor:pointer;

}

.wallet-tab.active{

  background:#eebbd0;

  color:white;

  font-weight:bold;

}

.card{

  background:white;

  border-radius:18px;

  padding:16px;

  margin-bottom:14px;

  box-shadow:0 3px 12px rgba(180,120,150,.1);

}

.card-title{

  font-size:15px;

  font-weight:bold;

  color:#936b7d;

  margin-bottom:12px;

}

.type-buttons{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-bottom:12px;

}

.type-btn{

  border:1px solid #f0d4df;

  background:#fff;

  border-radius:12px;

  padding:10px;

  color:#999;

  cursor:pointer;

}

.type-btn.active.expense{

  background:#f4b6c9;

  color:white;

}

.type-btn.active.income{

  background:#b8d9c4;

  color:white;

}

input,select{

  width:100%;

  border:1px solid #ead9df;

  border-radius:11px;

  padding:11px;

  font-size:14px;

  color:#555;

  background:#fff;

  margin-bottom:9px;

  outline:none;

}

input:focus,select:focus{

  border-color:#dda8bf;

}

.amount{

  font-size:22px;

  text-align:right;

}

.save-btn{

  width:100%;

  border:none;

  border-radius:13px;

  padding:13px;

  background:#d98eae;

  color:white;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

}

.cancel-btn{

  width:100%;

  border:none;

  border-radius:13px;

  padding:11px;

  background:#eee;

  color:#777;

  font-size:14px;

  margin-top:7px;

  cursor:pointer;

  display:none;

}

.summary{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

}

.summary-box{

  border-radius:14px;

  padding:13px;

  text-align:center;

}

.summary-box.exp{

  background:#fff0f4;

}

.summary-box.inc{

  background:#eef8f1;

}

.summary-label{

  font-size:11px;

  color:#999;

}

.summary-number{

  font-size:20px;

  font-weight:bold;

  margin-top:3px;

}

.exp .summary-number{

  color:#d6819e;

}

.inc .summary-number{

  color:#76a88a;

}

.month-control{

  display:flex;

  align-items:center;

  gap:7px;

}

.month-control button{

  border:none;

  background:#f3d5e1;

  color:#936b7d;

  width:36px;

  height:36px;

  border-radius:50%;

  font-size:18px;

  cursor:pointer;

}

.month-control input{

  margin:0;

  text-align:center;

}

.education-total{

  background:linear-gradient(135deg,#fff0f6,#f6ebff);

  border-radius:15px;

  padding:16px;

  text-align:center;

  margin-bottom:12px;

}

.education-total .label{

  font-size:12px;

  color:#999;

}

.education-total .total{

  font-size:27px;

  font-weight:bold;

  color:#a16c91;

  margin-top:4px;

}

.list{

  margin-top:4px;

}

.item{

  border-bottom:1px solid #f3e7eb;

  padding:12px 0;

}

.item:last-child{

  border-bottom:none;

}

.item-top{

  display:flex;

  justify-content:space-between;

  gap:10px;

}

.item-name{

  font-weight:bold;

  color:#666;

  word-break:break-all;

}

.item-amount{

  font-weight:bold;

  white-space:nowrap;

}

.item-amount.expense{

  color:#d6819e;

}

.item-amount.income{

  color:#76a88a;

}

.item-bottom{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-top:5px;

  color:#aaa;

  font-size:11px;

}

.item-buttons button{

  border:none;

  background:#f8eef2;

  color:#a2788a;

  border-radius:8px;

  padding:5px 9px;

  margin-left:4px;

  cursor:pointer;

}

.empty{

  text-align:center;

  padding:25px 10px;

  color:#bbb;

  font-size:13px;

}

.category-manager{

  display:flex;

  gap:6px;

}

.category-manager input{

  margin:0;

}

.small-btn{

  border:none;

  border-radius:10px;

  background:#efd2df;

  color:#8d6678;

  padding:0 13px;

  cursor:pointer;

}

.category-list{

  margin-top:10px;

  display:flex;

  flex-wrap:wrap;

  gap:6px;

}

.category-chip{

  background:#faf0f4;

  color:#9a7484;

  padding:6px 9px;

  border-radius:20px;

  font-size:11px;

}

.category-chip button{

  border:none;

  background:none;

  color:#c895a8;

  margin-left:3px;

  cursor:pointer;

}

.notice{

  text-align:center;

  color:#aaa;

  font-size:11px;

  padding:5px;

}

.hidden{

  display:none!important;

}

</style>

</head>

<body>

<header>

  <h1>♡ リリアン家計簿 ♡</h1>

  <p>かわいく、ざっくり、ちゃんと管理</p>

</header>

<div class="container">

  <!-- 財布 -->

  <div class="wallet-tabs">

    <button class="wallet-tab active" data-wallet="家計簿">🏠<br>家計簿</button>

    <button class="wallet-tab" data-wallet="リリアン個人">💕<br>個人</button>

    <button class="wallet-tab" data-wallet="リリアン給与">💰<br>給与</button>

    <button class="wallet-tab" data-wallet="教育">🎓<br>教育</button>

  </div>

  <!-- 入力 -->

  <div class="card">

    <div class="card-title" id="formTitle">🏠 家計簿に入力</div>

    <div class="type-buttons">

      <button class="type-btn active expense" id="expenseBtn">

        支出

      </button>

      <button class="type-btn income" id="incomeBtn">

        収入

      </button>

    </div>

    <input type="date" id="dateInput">

    <input

      type="number"

      id="amountInput"

      class="amount"

      placeholder="金額"

      min="0"

    >

    <input

      type="text"

      id="memoInput"

      placeholder="内容（例：スーパー、塾代など）"

    >

    <select id="categoryInput"></select>

    <button class="save-btn" id="saveBtn">

      追加する ♡

    </button>

    <button class="cancel-btn" id="cancelBtn">

      編集をキャンセル

    </button>

  </div>

  <!-- 集計 -->

  <div class="card">

    <div class="card-title">📊 集計</div>

    <div id="monthlyArea">

      <div class="month-control">

        <button id="prevMonth">‹</button>

        <input type="month" id="monthInput">

        <button id="nextMonth">›</button>

      </div>

      <br>

      <div class="summary">

        <div class="summary-box exp">

          <div class="summary-label">今月の支出</div>

          <div class="summary-number" id="monthlyExpense">¥0</div>

        </div>

        <div class="summary-box inc">

          <div class="summary-label">今月の収入</div>

          <div class="summary-number" id="monthlyIncome">¥0</div>

        </div>

      </div>

      <br>

      <div class="summary">

        <div class="summary-box">

          <div class="summary-label">残り</div>

          <div class="summary-number" id="monthlyBalance">¥0</div>

        </div>

        <div class="summary-box">

          <div class="summary-label">件数</div>

          <div class="summary-number" id="monthlyCount">0件</div>

        </div>

      </div>

    </div>

    <div id="educationArea" class="hidden">

      <div class="education-total">

        <div class="label">🎓 教育費・これまでの累計</div>

        <div class="total" id="educationTotal">¥0</div>

      </div>

      <div class="summary">

        <div class="summary-box exp">

          <div class="summary-label">教育費支出</div>

          <div class="summary-number" id="educationExpense">¥0</div>

        </div>

        <div class="summary-box inc">

          <div class="summary-label">教育関連収入</div>

          <div class="summary-number" id="educationIncome">¥0</div>

        </div>

      </div>

    </div>

  </div>

  <!-- カテゴリ -->

  <div class="card">

    <div class="card-title">🏷 カテゴリ</div>

    <div class="category-manager">

      <input

        type="text"

        id="newCategory"

        placeholder="カテゴリを追加"

      >

      <button class="small-btn" id="addCategory">

        追加

      </button>

    </div>

    <div class="category-list" id="categoryList"></div>

  </div>

  <!-- 明細 -->

  <div class="card">

    <div class="card-title" id="listTitle">

      🧾 今月の明細

    </div>

    <div class="list" id="transactionList"></div>

  </div>

  <div class="notice">

    ※データはこのブラウザ内に保存されます

  </div>

</div>

<script>

const defaultCategories = {

  "家計簿":[

    "食費",

    "日用品",

    "外食",

    "交通費",

    "光熱費",

    "通信費",

    "住居費",

    "医療費",

    "レジャー",

    "その他"

  ],

  "リリアン個人":[

    "美容",

    "洋服",

    "コスメ",

    "カフェ",

    "趣味",

    "その他"

  ],

  "リリアン給与":[

    "給与",

    "臨時収入",

    "その他"

  ],

  "教育":[

    "塾",

    "学校",

    "教材",

    "模試",

    "習い事",

    "制服・用品",

    "交通費",

    "その他"

  ]

};

let data =

  JSON.parse(localStorage.getItem("ririanKakeiboData") || "[]");

let categories =

  JSON.parse(localStorage.getItem("ririanKakeiboCategories") || "null")

  || JSON.parse(JSON.stringify(defaultCategories));

let currentWallet = "家計簿";

let currentType = "expense";

let editingId = null;

const dateInput = document.getElementById("dateInput");

const amountInput = document.getElementById("amountInput");

const memoInput = document.getElementById("memoInput");

const categoryInput = document.getElementById("categoryInput");

const monthInput = document.getElementById("monthInput");

function todayString(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

function currentMonthString(){

  return todayString().slice(0,7);

}

dateInput.value = todayString();

monthInput.value = currentMonthString();

function saveData(){

  localStorage.setItem(

    "ririanKakeiboData",

    JSON.stringify(data)

  );

  localStorage.setItem(

    "ririanKakeiboCategories",

    JSON.stringify(categories)

  );

}

function yen(num){

  return "¥" + Number(num || 0).toLocaleString("ja-JP");

}

function updateCategorySelect(){

  categoryInput.innerHTML = "";

  categories[currentWallet].forEach(cat=>{

    const option = document.createElement("option");

    option.value = cat;

    option.textContent = cat;

    categoryInput.appendChild(option);

  });

}

function updateCategoryList(){

  const list = document.getElementById("categoryList");

  list.innerHTML = "";

  categories[currentWallet].forEach((cat,index)=>{

    const chip = document.createElement("div");

    chip.className = "category-chip";

    chip.innerHTML =

      `${escapeHtml(cat)}

      <button onclick="deleteCategory(${index})">×</button>`;

    list.appendChild(chip);

  });

}

function escapeHtml(str){

  return String(str)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function updateWalletUI(){

  document.querySelectorAll(".wallet-tab").forEach(btn=>{

    btn.classList.toggle(

      "active",

      btn.dataset.wallet === currentWallet

    );

  });

  document.getElementById("formTitle").textContent =

    `♡ ${currentWallet}に入力`;

  updateCategorySelect();

  updateCategoryList();

  if(currentWallet === "教育"){

    document.getElementById("monthlyArea")

      .classList.add("hidden");

    document.getElementById("educationArea")

      .classList.remove("hidden");

    document.getElementById("listTitle").textContent =

      "🎓 教育費の明細";

  }else{

    document.getElementById("monthlyArea")

      .classList.remove("hidden");

    document.getElementById("educationArea")

      .classList.add("hidden");

    document.getElementById("listTitle").textContent =

      "🧾 今月の明細";

  }

  render();

}

document.querySelectorAll(".wallet-tab").forEach(btn=>{

  btn.addEventListener("click",()=>{

    currentWallet = btn.dataset.wallet;

    editingId = null;

    resetForm();

    updateWalletUI();

  });

});

document.getElementById("expenseBtn")

  .addEventListener("click",()=>{

    currentType = "expense";

    document.getElementById("expenseBtn")

      .classList.add("active");

    document.getElementById("incomeBtn")

      .classList.remove("active");

  });

document.getElementById("incomeBtn")

  .addEventListener("click",()=>{

    currentType = "income";

    document.getElementById("incomeBtn")

      .classList.add("active");

    document.getElementById("expenseBtn")

      .classList.remove("active");

  });

document.getElementById("saveBtn")

  .addEventListener("click",saveTransaction);

function saveTransaction(){

  const date = dateInput.value;

  const amount = Number(amountInput.value);

  const memo = memoInput.value.trim();

  const category = categoryInput.value;

  if(!date){

    alert("日付を入力してね");

    return;

  }

  if(!amount || amount <= 0){

    alert("金額を入力してね");

    return;

  }

  if(!memo){

    alert("内容を入力してね");

    return;

  }

  if(editingId){

    const item = data.find(x=>x.id === editingId);

    if(item){

      item.wallet = currentWallet;

      item.type = currentType;

      item.date = date;

      item.amount = amount;

      item.memo = memo;

      item.category = category;

    }

  }else{

    data.push({

      id: Date.now().toString(),

      wallet: currentWallet,

      type: currentType,

      date: date,

      amount: amount,

      memo: memo,

      category: category

    });

  }

  saveData();

  editingId = null;

  resetForm();

  render();

}

function resetForm(){

  dateInput.value = todayString();

  amountInput.value = "";

  memoInput.value = "";

  currentType = "expense";

  document.getElementById("expenseBtn")

    .classList.add("active");

  document.getElementById("incomeBtn")

    .classList.remove("active");

  document.getElementById("saveBtn").textContent =

    "追加する ♡";

  document.getElementById("cancelBtn")

    .style.display = "none";

}

window.editTransaction = function(id){

  const item = data.find(x=>x.id === id);

  if(!item) return;

  editingId = id;

  currentWallet = item.wallet;

  currentType = item.type;

  updateWalletUI();

  dateInput.value = item.date;

  amountInput.value = item.amount;

  memoInput.value = item.memo;

  categoryInput.value = item.category;

  if(currentType === "expense"){

    document.getElementById("expenseBtn")

      .classList.add("active");

    document.getElementById("incomeBtn")

      .classList.remove("active");

  }else{

    document.getElementById("incomeBtn")

      .classList.add("active");

    document.getElementById("expenseBtn")

      .classList.remove("active");

  }

  document.getElementById("saveBtn").textContent =

    "変更を保存する ♡";

  document.getElementById("cancelBtn")

    .style.display = "block";

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

};

window.deleteTransaction = function(id){

  if(!confirm("この明細を削除する？")) return;

  data = data.filter(x=>x.id !== id);

  saveData();

  render();

};

document.getElementById("cancelBtn")

  .addEventListener("click",()=>{

    editingId = null;

    resetForm();

  });

document.getElementById("monthInput")

  .addEventListener("change",render);

document.getElementById("prevMonth")

  .addEventListener("click",()=>{

    const d = new Date(monthInput.value + "-01");

    d.setMonth(d.getMonth()-1);

    monthInput.value =

      d.toISOString().slice(0,7);

    render();

  });

document.getElementById("nextMonth")

  .addEventListener("click",()=>{

    const d = new Date(monthInput.value + "-01");

    d.setMonth(d.getMonth()+1);

    monthInput.value =

      d.toISOString().slice(0,7);

    render();

  });

function render(){

  const walletData =

    data.filter(x=>x.wallet === currentWallet);

  if(currentWallet === "教育"){

    renderEducation(walletData);

  }else{

    renderMonthly(walletData);

  }

  renderList(walletData);

}

function renderMonthly(items){

  const month = monthInput.value;

  const monthly =

    items.filter(x=>x.date.startsWith(month));

  const expense =

    monthly

      .filter(x=>x.type === "expense")

      .reduce((sum,x)=>sum+x.amount,0);

  const income =

    monthly

      .filter(x=>x.type === "income")

      .reduce((sum,x)=>sum+x.amount,0);

  document.getElementById("monthlyExpense")

    .textContent = yen(expense);

  document.getElementById("monthlyIncome")

    .textContent = yen(income);

  document.getElementById("monthlyBalance")

    .textContent = yen(income-expense);

  document.getElementById("monthlyCount")

    .textContent = monthly.length + "件";

}

function renderEducation(items){

  const expense =

    items

      .filter(x=>x.type === "expense")

      .reduce((sum,x)=>sum+x.amount,0);

  const income =

    items

      .filter(x=>x.type === "income")

      .reduce((sum,x)=>sum+x.amount,0);

  document.getElementById("educationTotal")

    .textContent = yen(expense);

  document.getElementById("educationExpense")

    .textContent = yen(expense);

  document.getElementById("educationIncome")

    .textContent = yen(income);

}

function renderList(items){

  let listItems = items;

  if(currentWallet !== "教育"){

    const month = monthInput.value;

    listItems =

      items.filter(x=>x.date.startsWith(month));

  }

  listItems =

    [...listItems].sort((a,b)=>

      b.date.localeCompare(a.date)

    );

  const list =

    document.getElementById("transactionList");

  list.innerHTML = "";

  if(listItems.length === 0){

    list.innerHTML =

      '<div class="empty">まだ明細がないよ♡</div>';

    return;

  }

  listItems.forEach(item=>{

    const div = document.createElement("div");

    div.className = "item";

    const sign =

      item.type === "expense" ? "−" : "+";

    div.innerHTML = `

      <div class="item-top">

        <div class="item-name">

          ${escapeHtml(item.memo)}

        </div>

        <div class="item-amount ${item.type}">

          ${sign}${yen(item.amount)}

        </div>

      </div>

      <div class="item-bottom">

        <div>

          ${escapeHtml(item.date)}

          ／

          ${escapeHtml(item.category)}

        </div>

        <div class="item-buttons">

          <button onclick="editTransaction('${item.id}')">

            編集

          </button>

          <button onclick="deleteTransaction('${item.id}')">

            削除

          </button>

        </div>

      </div>

    `;

    list.appendChild(div);

  });

}

document.getElementById("addCategory")

  .addEventListener("click",()=>{

    const input =

      document.getElementById("newCategory");

    const name = input.value.trim();

    if(!name) return;

    if(categories[currentWallet].includes(name)){

      alert("そのカテゴリはもうあるよ");

      return;

    }

    categories[currentWallet].push(name);

    input.value = "";

    saveData();

    updateCategorySelect();

    updateCategoryList();

  });

document.getElementById("newCategory")

  .addEventListener("keydown",e=>{

    if(e.key === "Enter"){

      document.getElementById("addCategory").click();

    }

  });

window.deleteCategory = function(index){

  const name =

    categories[currentWallet][index];

  if(!confirm(

    `「${name}」を削除する？\n\nすでに登録済みの明細には影響しません。`

  )) return;

  categories[currentWallet].splice(index,1);

  saveData();

  updateCategorySelect();

  updateCategoryList();

};

updateWalletUI();

</script>

</body>

</html>
