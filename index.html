<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>リリアン家計簿</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#fff7fa;

  color:#555;

  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;

}

header{

  background:#f6cfdc;

  padding:22px 18px 18px;

  text-align:center;

  color:#fff;

}

h1{margin:0;font-size:25px}

.subtitle{font-size:12px;margin-top:5px}

.tabs{

  display:flex;

  background:white;

  padding:8px;

  gap:6px;

  position:sticky;

  top:0;

  z-index:2;

}

.tab{

  flex:1;

  border:0;

  background:#fff0f5;

  border-radius:14px;

  padding:10px 3px;

  color:#b87891;

}

.tab.active{

  background:#e9a9bd;

  color:white;

  font-weight:bold;

}

main{

  padding:16px;

  max-width:600px;

  margin:auto;

}

.card{

  background:white;

  border-radius:20px;

  padding:18px;

  margin-bottom:14px;

  box-shadow:0 3px 12px #e9ccd5;

}

.balance{

  font-size:28px;

  font-weight:bold;

  color:#bd6f8b;

}

.wallet{

  font-size:13px;

  color:#999;

}

label{

  display:block;

  margin:12px 0 5px;

  font-size:13px;

}

input,select,button{font:inherit}

input,select{

  width:100%;

  padding:12px;

  border:1px solid #efd8df;

  border-radius:12px;

  background:#fff;

}

.add{

  width:100%;

  border:0;

  border-radius:15px;

  padding:14px;

  margin-top:15px;

  background:#d98ca8;

  color:white;

  font-weight:bold;

}

.item{

  display:flex;

  justify-content:space-between;

  padding:12px 0;

  border-bottom:1px solid #f4e5e9;

}

.amount{

  font-weight:bold;

  color:#b86684;

}

.wallet-buttons{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.wallet-button{

  border:0;

  border-radius:16px;

  padding:15px 8px;

  background:#fff0f5;

  color:#b87891;

}

.wallet-button.selected{

  background:#e9a9bd;

  color:white;

  font-weight:bold;

}

.delete{

  border:0;

  background:none;

  color:#c99;

  font-size:12px;

}

.empty{

  text-align:center;

  color:#aaa;

  padding:20px 0;

  font-size:13px;

}

</style>

</head>

<body>

<header>

  <h1>♡ リリアン家計簿 ♡</h1>

  <div class="subtitle">毎日の家計をかわいくシンプルに</div>

</header>

<div class="tabs">

  <button class="tab active" onclick="showTab('home',this)">ホーム</button>

  <button class="tab" onclick="showTab('add',this)">入力</button>

  <button class="tab" onclick="showTab('history',this)">履歴</button>

</div>

<main>

<!-- ホーム -->

<section id="home">

  <div class="card">

    <div class="wallet">現在の合計残高</div>

    <div class="balance" id="totalBalance">¥0</div>

  </div>

  <div class="card">

    <h3>♡ お財布</h3>

    <div class="wallet-buttons">

      <button class="wallet-button" onclick="selectWallet('家計簿')">

        🏠<br>家計簿

      </button>

      <button class="wallet-button" onclick="selectWallet('リリアン個人')">

        🎀<br>リリアン個人

      </button>

      <button class="wallet-button" onclick="selectWallet('リリアン給与')">

        💰<br>リリアン給与

      </button>

      <button class="wallet-button" onclick="selectWallet('教育')">

        📚<br>教育

      </button>

    </div>

  </div>

  <div class="card">

    <h3>♡ 最近の記録</h3>

    <div id="recentList"></div>

  </div>

</section>

<!-- 入力 -->

<section id="add" style="display:none">

  <div class="card">

    <h3>♡ お金を記録する</h3>

    <label>お財布</label>

    <select id="wallet">

      <option>家計簿</option>

      <option>リリアン個人</option>

      <option>リリアン給与</option>

      <option>教育</option>

    </select>

    <label>種類</label>

    <select id="type">

      <option value="expense">支出</option>

      <option value="income">収入</option>

    </select>

    <label>金額</label>

    <input id="amount" type="number" placeholder="例：1200">

    <label>内容</label>

    <input id="memo" type="text" placeholder="例：スーパー">

    <label>日付</label>

    <input id="date" type="date">

    <button class="add" onclick="addRecord()">♡ 記録する</button>

  </div>

</section>

<!-- 履歴 -->

<section id="history" style="display:none">

  <div class="card">

    <h3>♡ 家計簿の履歴</h3>

    <div id="historyList"></div>

  </div>

</section>

</main>

<script>

let records = JSON.parse(localStorage.getItem("ririanRecords") || "[]");

const today = new Date().toISOString().slice(0,10);

document.getElementById("date").value = today;

function save(){

  localStorage.setItem("ririanRecords", JSON.stringify(records));

}

function yen(n){

  return "¥" + Number(n).toLocaleString("ja-JP");

}

function addRecord(){

  const wallet = document.getElementById("wallet").value;

  const type = document.getElementById("type").value;

  const amount = Number(document.getElementById("amount").value);

  const memo = document.getElementById("memo").value.trim();

  const date = document.getElementById("date").value;

  if(!amount){

    alert("金額を入力してね♡");

    return;

  }

  records.unshift({

    id:Date.now(),

    wallet,

    type,

    amount,

    memo: memo || "記録",

    date

  });

  save();

  document.getElementById("amount").value="";

  document.getElementById("memo").value="";

  update();

  alert("記録したよ♡");

  showTab("home",document.querySelector(".tab"));

}

function deleteRecord(id){

  if(!confirm("この記録を削除する？")) return;

  records = records.filter(r => r.id !== id);

  save();

  update();

}

function selectWallet(name){

  document.getElementById("wallet").value = name;

  showTab("add",document.querySelectorAll(".tab")[1]);

}

function showTab(name,button){

  document.getElementById("home").style.display="none";

  document.getElementById("add").style.display="none";

  document.getElementById("history").style.display="none";

  document.getElementById(name).style.display="block";

  document.querySelectorAll(".tab").forEach(t=>{

    t.classList.remove("active");

  });

  if(button) button.classList.add("active");

  update();

}

function update(){

  let total = 0;

  records.forEach(r=>{

    if(r.type === "income"){

      total += r.amount;

    }else{

      total -= r.amount;

    }

  });

  document.getElementById("totalBalance").textContent = yen(total);

  const recent = records.slice(0,5);

  if(recent.length === 0){

    document.getElementById("recentList").innerHTML =

      '<div class="empty">まだ記録がないよ♡</div>';

  }else{

    document.getElementById("recentList").innerHTML =

      recent.map(makeItem).join("");

  }

  if(records.length === 0){

    document.getElementById("historyList").innerHTML =

      '<div class="empty">まだ記録がないよ♡</div>';

  }else{

    document.getElementById("historyList").innerHTML =

      records.map(makeItem).join("");

  }

}

function makeItem(r){

  const sign = r.type === "income" ? "+" : "-";

  return `

    <div class="item">

      <div>

        <div>${r.memo}</div>

        <div class="wallet">${r.wallet} ・ ${r.date}</div>

      </div>

      <div style="text-align:right">

        <div class="amount">${sign}${yen(r.amount)}</div>

        <button class="delete" onclick="deleteRecord(${r.id})">

          削除

        </button>

      </div>

    </div>

  `;

}

update();

</script>

</body>

</html>
