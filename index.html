<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>リリアン家計簿</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#fff7fa;

  color:#555;

  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;

}

header{

  background:#f6cfdc;

  padding:22px 18px 18px;

  text-align:center;

  color:white;

}

h1{margin:0;font-size:25px}

.subtitle{font-size:12px;margin-top:5px}

.tabs{

  display:flex;

  background:white;

  padding:8px;

  gap:6px;

  position:sticky;

  top:0;

  z-index:2;

}

.tab{

  flex:1;

  border:0;

  background:#fff0f5;

  border-radius:14px;

  padding:10px 3px;

  color:#b87891;

}

.tab.active{

  background:#e9a9bd;

  color:white;

  font-weight:bold;

}

main{

  padding:16px;

  max-width:600px;

  margin:auto;

}

.card{

  background:white;

  border-radius:20px;

  padding:18px;

  margin-bottom:14px;

  box-shadow:0 3px 12px #e9ccd5;

}

.card h3{

  margin-top:0;

  color:#b87891;

}

.balance{

  font-size:28px;

  font-weight:bold;

  color:#bd6f8b;

}

.wallet{

  font-size:13px;

  color:#999;

}

.month-total{

  font-size:24px;

  font-weight:bold;

  color:#bd6f8b;

  margin-top:5px;

}

.category-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:11px 0;

  border-bottom:1px solid #f4e5e9;

}

.category-name{

  display:flex;

  align-items:center;

  gap:7px;

}

.category-amount{

  font-weight:bold;

  color:#b86684;

}

label{

  display:block;

  margin:12px 0 5px;

  font-size:13px;

}

input,select,button{

  font:inherit;

}

input,select{

  width:100%;

  padding:12px;

  border:1px solid #efd8df;

  border-radius:12px;

  background:#fff;

}

.add{

  width:100%;

  border:0;

  border-radius:15px;

  padding:14px;

  margin-top:15px;

  background:#d98ca8;

  color:white;

  font-weight:bold;

}

.wallet-buttons{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.wallet-button{

  border:0;

  border-radius:16px;

  padding:15px 8px;

  background:#fff0f5;

  color:#b87891;

}

.item{

  display:flex;

  justify-content:space-between;

  padding:12px 0;

  border-bottom:1px solid #f4e5e9;

}

.amount{

  font-weight:bold;

  color:#b86684;

}

.income{

  color:#76a987;

}

.delete{

  border:0;

  background:none;

  color:#c99;

  font-size:12px;

  margin-top:4px;

}

.empty{

  text-align:center;

  color:#aaa;

  padding:20px 0;

  font-size:13px;

}

.small-button{

  border:0;

  border-radius:12px;

  padding:9px 12px;

  background:#fff0f5;

  color:#b87891;

}

.category-setting{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:10px 0;

  border-bottom:1px solid #f4e5e9;

}

.delete-category{

  border:0;

  background:none;

  color:#c99;

  font-size:12px;

}

select{

  appearance:auto;

}

</style>

</head>

<body>

<header>

  <h1>♡ リリアン家計簿 ♡</h1>

  <div class="subtitle">毎日の家計をかわいくシンプルに</div>

</header>

<div class="tabs">

  <button class="tab active" onclick="showTab('home',this)">ホーム</button>

  <button class="tab" onclick="showTab('add',this)">入力</button>

  <button class="tab" onclick="showTab('history',this)">履歴</button>

  <button class="tab" onclick="showTab('settings',this)">設定</button>

</div>

<main>

<!-- ホーム -->

<section id="home">

  <div class="card">

    <div class="wallet">現在の合計残高</div>

    <div class="balance" id="totalBalance">¥0</div>

  </div>

  <div class="card">

    <h3>♡ お財布</h3>

    <div class="wallet-buttons">

      <button class="wallet-button" onclick="selectWallet('家計簿')">

        🏠<br>家計簿

      </button>

      <button class="wallet-button" onclick="selectWallet('リリアン個人')">

        🎀<br>リリアン個人

      </button>

      <button class="wallet-button" onclick="selectWallet('リリアン給与')">

        💰<br>リリアン給与

      </button>

      <button class="wallet-button" onclick="selectWallet('教育')">

        📚<br>教育

      </button>

    </div>

  </div>

  <div class="card">

    <h3>♡ 今月の支出</h3>

    <div class="wallet">今月の合計</div>

    <div class="month-total" id="monthTotal">¥0</div>

    <div id="categoryTotals"></div>

  </div>

  <div class="card">

    <h3>♡ 最近の記録</h3>

    <div id="recentList"></div>

  </div>

</section>

<!-- 入力 -->

<section id="add" style="display:none">

  <div class="card">

    <h3>♡ お金を記録する</h3>

    <label>お財布</label>

    <select id="wallet">

      <option>家計簿</option>

      <option>リリアン個人</option>

      <option>リリアン給与</option>

      <option>教育</option>

    </select>

    <label>種類</label>

    <select id="type">

      <option value="expense">支出</option>

      <option value="income">収入</option>

    </select>

    <label>カテゴリ</label>

    <select id="category"></select>

    <label>金額</label>

    <input

      id="amount"

      type="number"

      inputmode="numeric"

      placeholder="例：1200"

    >

    <label>内容</label>

    <input

      id="memo"

      type="text"

      placeholder="例：スーパー"

    >

    <label>日付</label>

    <input id="date" type="date">

    <button class="add" onclick="addRecord()">

      ♡ 記録する

    </button>

  </div>

</section>

<!-- 履歴 -->

<section id="history" style="display:none">

  <div class="card">

    <h3>♡ 家計簿の履歴</h3>

    <div id="historyList"></div>

  </div>

</section>

<!-- 設定 -->

<section id="settings" style="display:none">

  <div class="card">

    <h3>♡ カテゴリ設定</h3>

    <div class="wallet">

      よく使うカテゴリを追加できます

    </div>

    <div id="categorySettings"></div>

    <button

      class="add"

      onclick="addCategory()"

    >

      ＋ カテゴリを追加

    </button>

  </div>

</section>

</main>

<script>

const defaultCategories = [

  "食費",

  "日用品",

  "衣服",

  "教育",

  "美容",

  "住居",

  "交通",

  "その他"

];

let categories =

  JSON.parse(localStorage.getItem("ririanCategories") || "null")

  || defaultCategories;

let records =

  JSON.parse(localStorage.getItem("ririanRecords") || "[]");

/* 以前の記録にカテゴリがない場合 */

records = records.map(r => {

  if(!r.category){

    r.category = "その他";

  }

  return r;

});

function save(){

  localStorage.setItem(

    "ririanRecords",

    JSON.stringify(records)

  );

  localStorage.setItem(

    "ririanCategories",

    JSON.stringify(categories)

  );

}

function yen(n){

  return "¥" + Number(n).toLocaleString("ja-JP");

}

function todayString(){

  return new Date().toISOString().slice(0,10);

}

document.getElementById("date").value = todayString();

function updateCategorySelect(){

  const select =

    document.getElementById("category");

  select.innerHTML =

    categories.map(c =>

      `<option>${escapeHtml(c)}</option>`

    ).join("");

}

function addRecord(){

  const wallet =

    document.getElementById("wallet").value;

  const type =

    document.getElementById("type").value;

  const category =

    document.getElementById("category").value;

  const amount =

    Number(document.getElementById("amount").value);

  const memo =

    document.getElementById("memo").value.trim();

  const date =

    document.getElementById("date").value;

  if(!amount){

    alert("金額を入力してね♡");

    return;

  }

  records.unshift({

    id:Date.now(),

    wallet,

    type,

    category,

    amount,

    memo:memo || "記録",

    date

  });

  save();

  document.getElementById("amount").value = "";

  document.getElementById("memo").value = "";

  update();

  alert("記録したよ♡");

  showTab(

    "home",

    document.querySelector(".tab")

  );

}

function deleteRecord(id){

  if(!confirm("この記録を削除する？")) return;

  records =

    records.filter(r => r.id !== id);

  save();

  update();

}

function selectWallet(name){

  document.getElementById("wallet").value = name;

  showTab(

    "add",

    document.querySelectorAll(".tab")[1]

  );

}

function showTab(name,button){

  document.getElementById("home").style.display="none";

  document.getElementById("add").style.display="none";

  document.getElementById("history").style.display="none";

  document.getElementById("settings").style.display="none";

  document.getElementById(name).style.display="block";

  document.querySelectorAll(".tab").forEach(t => {

    t.classList.remove("active");

  });

  if(button){

    button.classList.add("active");

  }

  update();

}

function update(){

  let total = 0;

  records.forEach(r => {

    if(r.type === "income"){

      total += r.amount;

    }else{

      total -= r.amount;

    }

  });

  document.getElementById(

    "totalBalance"

  ).textContent = yen(total);

  /* 今月 */

  const month =

    todayString().slice(0,7);

  const thisMonth =

    records.filter(r =>

      r.date &&

      r.date.slice(0,7) === month

    );

  let monthTotal = 0;

  thisMonth.forEach(r => {

    if(r.type === "expense"){

      monthTotal += r.amount;

    }

  });

  document.getElementById(

    "monthTotal"

  ).textContent = yen(monthTotal);

  /* カテゴリ別小計 */

  const totals = {};

  categories.forEach(c => {

    totals[c] = 0;

  });

  thisMonth.forEach(r => {

    if(

      r.type === "expense" &&

      totals[r.category] !== undefined

    ){

      totals[r.category] += r.amount;

    }

  });

  const categoryHtml =

    categories

      .filter(c => totals[c] > 0)

      .map(c => `

        <div class="category-row">

          <div class="category-name">

            ${categoryIcon(c)}

            ${escapeHtml(c)}

          </div>

          <div class="category-amount">

            ${yen(totals[c])}

          </div>

        </div>

      `)

      .join("");

  document.getElementById(

    "categoryTotals"

  ).innerHTML =

    categoryHtml ||

    '<div class="empty">今月の支出はまだないよ♡</div>';

  /* 最近 */

  const recent =

    records.slice(0,5);

  document.getElementById(

    "recentList"

  ).innerHTML = recent.length

    ? recent.map(makeItem).join("")

    : '<div class="empty">まだ記録がないよ♡</div>';

  /* 履歴 */

  document.getElementById(

    "historyList"

  ).innerHTML = records.length

    ? records.map(makeItem).join("")

    : '<div class="empty">まだ記録がないよ♡</div>';

  updateCategorySettings();

}

function makeItem(r){

  const sign =

    r.type === "income" ? "+" : "-";

  const amountClass =

    r.type === "income"

      ? "amount income"

      : "amount";

  return `

    <div class="item">

      <div>

        <div>

          ${categoryIcon(r.category)}

          ${escapeHtml(r.memo)}

        </div>

        <div class="wallet">

          ${escapeHtml(r.wallet)}

          ・

          ${escapeHtml(r.category || "その他")}

          ・

          ${escapeHtml(r.date)}

        </div>

      </div>

      <div style="text-align:right">

        <div class="${amountClass}">

          ${sign}${yen(r.amount)}

        </div>

        <button

          class="delete"

          onclick="deleteRecord(${r.id})"

        >

          削除

        </button>

      </div>

    </div>

  `;

}

function categoryIcon(category){

  const icons = {

    "食費":"🍚",

    "日用品":"🧻",

    "衣服":"👗",

    "教育":"📚",

    "美容":"💄",

    "住居":"🏠",

    "交通":"🚃",

    "その他":"🎀"

  };

  return icons[category] || "♡";

}

function addCategory(){

  const name =

    prompt("追加するカテゴリ名を入力してね♡");

  if(!name) return;

  const trimmed =

    name.trim();

  if(!trimmed) return;

  if(categories.includes(trimmed)){

    alert("そのカテゴリはもうあるよ♡");

    return;

  }

  categories.push(trimmed);

  save();

  updateCategorySelect();

  update();

  alert(

    "「" +

    trimmed +

    "」を追加したよ♡"

  );

}

function deleteCategory(name){

  if(name === "その他"){

    alert("「その他」は残しておこう♡");

    return;

  }

  const used =

    records.some(r =>

      r.category === name

    );

  if(used){

    alert(

      "このカテゴリを使った記録があるので、削除できないよ♡"

    );

    return;

  }

  if(

    !confirm(

      "「" + name + "」を削除する？"

    )

  ) return;

  categories =

    categories.filter(c => c !== name);

  save();

  updateCategorySelect();

  update();

}

function updateCategorySettings(){

  document.getElementById(

    "categorySettings"

  ).innerHTML =

    categories.map(c => `

      <div class="category-setting">

        <span>

          ${categoryIcon(c)}

          ${escapeHtml(c)}

        </span>

        ${

          c !== "その他"

          ?

          `<button

            class="delete-category"

            onclick="deleteCategory('${escapeAttr(c)}')"

          >

            削除

          </button>`

          :

          ""

        }

      </div>

    `).join("");

}

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function escapeAttr(text){

  return String(text)

    .replace(/\\/g,"\\\\")

    .replace(/'/g,"\\'");

}

updateCategorySelect();

save();

update();

</script>

</body>

</html>
