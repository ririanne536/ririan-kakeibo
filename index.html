<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>リリアン家計簿</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#fff7fa;color:#555;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}

header{background:#f6cfdc;padding:22px 18px 18px;text-align:center;color:#fff}

h1{margin:0;font-size:25px}

.subtitle{font-size:12px;margin-top:5px}

.tabs{display:flex;background:white;padding:8px;gap:6px;position:sticky;top:0;z-index:2}

.tab{flex:1;border:0;background:#fff0f5;border-radius:14px;padding:10px 3px;color:#b87891}

.tab.active{background:#e9a9bd;color:white;font-weight:bold}

main{padding:16px;max-width:600px;margin:auto}

.card{background:white;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #e9ccd5}

.balance{font-size:28px;font-weight:bold;color:#bd6f8b}

.wallet{font-size:13px;color:#999}

label{display:block;margin:12px 0 5px;font-size:13px}

input,select,button{font:inherit}

input,select{width:100%;padding:12px;border:1px solid #efd8df;border-radius:12px;background:#fff}

.add{width:100%;border:0;border-radius:15px;padding:14px;margin-top:15px;background:#d98ca8;color:white;font-weight:bold}

.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f4e5e9}

.amount{font-weight:bold;color:#b86684}
